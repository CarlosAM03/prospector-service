name: prospector-export

on:
  push:
    paths: ['packages/prospector_export/**', '.github/workflows/prospector-export.yml']
  pull_request:
    paths: ['packages/prospector_export/**', '.github/workflows/prospector-export.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/prospector_export
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare dependencies
        run: |
          python -m pip install -e ".[dev,xlsx,fastapi]" setuptools wheel
          python -m pip download --only-binary=:all: --dest .validation/wheels "openpyxl>=3.1.5,<4"
      - name: Offline validation and installed wheel smoke
        run: python scripts/validate.py --wheelhouse .validation/wheels
