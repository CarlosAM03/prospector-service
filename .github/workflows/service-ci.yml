name: Service CI
on:
  push:
    branches: [main, feat/fastapi-service-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/constraints.txt
      - run: python -m pip install -c requirements/constraints.txt -e '.[dev]'
      - run: python -m compileall -q src
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  unit:
    name: unit and contract (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements/constraints.txt -e '.[dev]'
      - run: python -m pytest -q -m 'not integration and not browser and not contract'
      - run: python -m pytest -q -m contract

  integration:
    name: integration (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements/constraints.txt -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q -m 'integration or browser'

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -c requirements/constraints.txt -e '.[dev]'
      - run: python -m build
      - run: python -m pip wheel -c requirements/constraints.txt --wheel-dir .validation/wheels '.[dev]'
      - run: python scripts/installed_smoke.py --wheelhouse .validation/wheels
      - uses: actions/upload-artifact@v4
        with:
          name: service-distributions
          path: dist/*

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: docker build -t prospector-service:ci .
      - run: python scripts/container_smoke.py --image prospector-service:ci
