[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prospector-export"
version = "0.1.0"
description = "Independent seven-column CSV/XLSX export from Prospector CLI v1.0.0"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1.5,<4"]
fastapi = ["fastapi>=0.115,<1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2", "httpx>=0.27,<1", "setuptools>=77", "wheel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prospector_export = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["integration: offline consumer integration"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "build", "dist", ".validation"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
